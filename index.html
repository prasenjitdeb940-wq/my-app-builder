<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional AI App Builder</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #0B0F19; color: #F3F4F6; font-family: system-ui, sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Left Controls Panel -->
    <div class="w-full md:w-96 glass p-6 flex flex-col gap-6 overflow-y-auto border-r border-gray-800">
        <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">AI App Builder</h1>
            <p class="text-xs text-gray-400 mt-1">Generate professional apps instantly</p>
        </div>

        <!-- Secure API Key Section -->
        <div class="p-4 bg-gray-900/50 rounded-xl border border-gray-800">
            <label class="text-xs font-semibold text-gray-400 block mb-1">🔑 Gemini API Key (Saved Locally)</label>
            <div class="flex gap-2">
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="bg-gray-950 border border-gray-800 rounded-lg px-3 py-1.5 text-xs flex-1 focus:outline-none focus:border-blue-500">
                <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition">Save</button>
            </div>
            <p id="apiKeyStatus" class="text-[10px] text-yellow-500 mt-1">Please enter your API Key to activate the builder.</p>
        </div>

        <!-- Prompt Input Section -->
        <div class="flex flex-col gap-2">
            <label class="text-sm font-medium text-gray-300">Describe Your App Idea</label>
            <textarea id="appPrompt" rows="5" placeholder="E.g., Mujhe ek kapde bechne wala app chahiye jisme product catalog ho... (You can type in Hindi, Hinglish or English)" class="w-full bg-gray-950 border border-gray-800 rounded-xl p-3 text-sm focus:outline-none focus:border-purple-500 resize-none"></textarea>
        </div>

        <button onclick="generateApp()" id="generateBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-500/10 cursor-pointer">
            ✨ Generate App
        </button>

        <!-- Status & System Log Summary -->
        <div class="flex-1 flex flex-col gap-2">
            <label class="text-xs font-semibold text-gray-400">System Logs / Status</label>
            <div id="statusLog" class="flex-1 bg-gray-950 border border-gray-800 rounded-xl p-3 text-xs font-mono text-gray-400 overflow-y-auto whitespace-pre-wrap">System ready. Waiting for prompt...</div>
        </div>
    </div>

    <!-- Right Emulator Preview Screen -->
    <div class="flex-1 flex items-center justify-center p-4 bg-gray-950">
        <!-- Phone Frame Mockup -->
        <div class="relative w-[360px] h-[720px] bg-black rounded-[48px] shadow-2xl border-[12px] border-gray-800 flex flex-col overflow-hidden ring-4 ring-gray-900">
            <!-- Notch -->
            <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-32 h-5 bg-gray-800 rounded-b-2xl z-50"></div>
            
            <!-- Live App Render Canvas inside Emulator -->
            <div class="flex-1 bg-white relative">
                <iframe id="emulatorFrame" class="w-full h-full border-none bg-white"></iframe>
                <!-- Loading Overlay -->
                <div id="emulatorLoading" class="absolute inset-0 bg-gray-900/90 flex flex-col items-center justify-center p-6 text-center hidden z-40">
                    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="text-sm font-medium text-white">AI is writing code...</p>
                    <p class="text-xs text-gray-400 mt-1 animate-pulse">Aapka professional app taiyar ho raha hai.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check and Load Saved API Key on Start
        window.onload = function() {
            const savedKey = localStorage.getItem('user_gemini_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                document.getElementById('apiKeyStatus').innerText = "✅ API Key loaded and active!";
                document.getElementById('apiKeyStatus').className = "text-[10px] text-green-500 mt-1";
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) {
                localStorage.setItem('user_gemini_key', key);
                document.getElementById('apiKeyStatus').innerText = "✅ API Key saved securely!";
                document.getElementById('apiKeyStatus').className = "text-[10px] text-green-500 mt-1";
                alert("API Key Successfully Saved Locally!");
            } else {
                alert("Please enter a valid key.");
            }
        }

        async function generateApp() {
            const key = localStorage.getItem('user_gemini_key');
            const prompt = document.getElementById('appPrompt').value.trim();
            const logBox = document.getElementById('statusLog');
            const loading = document.getElementById('emulatorLoading');
            const iframe = document.getElementById('emulatorFrame');

            if (!key) {
                alert("Please save your Gemini API Key in the settings box first!");
                return;
            }
            if (!prompt) {
                alert("Please write your app idea prompt first!");
                return;
            }

            // Start Loading Visuals
            loading.classList.remove('hidden');
            logBox.innerText = "Connecting to Google Gemini API...\nAnalyzing layout requirement...";

            // Secure System Instruction for Language Matching Rule
            const systemInstruction = "You are an expert Android Frontend developer. Generate a beautiful, fully functional single-page web app application wrapper using clean HTML, modern responsive mobile-first Tailwind CSS, and robust JavaScript based on the user's idea. Output ONLY the raw HTML source code, absolutely no markdown formatting, no ```html tags, just pure executable code. IMPORTANT RULE: If the user inputs their prompt in Hindi or Hinglish, write a final status explanation summary paragraph at the absolute bottom inside a hidden comment block or text element explaining what you built in perfect friendly Hindi/Hinglish. If they write in English, explain in English.";

            try {
                // Call Gemini API directly from the client side securely using user's local key
                const response = await fetch(`https://googleapis.com{key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let generatedCode = data.candidates[0].content.parts[0].text;
                    
                    // Clean up potential markdown blocks if AI generates them by mistake
                    generatedCode = generatedCode.replace(/```html/g, '').replace(/```/g, '').trim();

                    // Render code inside the Emulator Frame
                    const blob = new Blob([generatedCode], { type: 'text/html' });
                    iframe.src = URL.createObjectURL(blob);

                    logBox.innerText = "✨ App Build Successful!\n\n[AI Summary]:\n" + (prompt.match(/[\u0900-\u097F]/) || prompt.toLowerCase().match(/(mujhe|banao|app|chahiye|hai|karne)/) 
                        ? "Aapka Android App interface taiyar kar diya gaya hai. Saari layouts aur visual configurations implement ho chuki hain!" 
                        : "Application UI code generated and successfully compiled into the emulator workspace views.");
                } else {
                    logBox.innerText = "Error: Invalid response structure from AI. Please try again.";
                }
            } catch (error) {
                console.error(error);
                logBox.innerText = "Failed to compile: " + error.message;
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
