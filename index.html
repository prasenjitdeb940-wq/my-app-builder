<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional AI App Builder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0B0F19; 
            color: #F3F4F6; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            padding: 15px;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle { color: #9CA3AF; font-size: 13px; margin-top: 4px; margin-bottom: 15px; }

        .card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label { font-size: 12px; font-weight: 600; color: #9CA3AF; display: block; }

        input[type="password"], textarea {
            width: 100%;
            background-color: #030712;
            border: 1px solid #1F2937;
            border-radius: 10px;
            color: #F3F4F6;
            padding: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus, textarea:focus { border-color: #3B82F6; }

        .api-row { display: flex; gap: 8px; }
        
        button {
            background: linear-gradient(to right, #2563EB, #7C3AED);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        
        button.btn-save { padding: 10px 16px; background: #2563EB; font-size: 13px; }

        #apiKeyStatus { font-size: 11px; color: #F59E0B; }

        #statusLog {
            background-color: #030712;
            border: 1px solid #1F2937;
            border-radius: 12px;
            padding: 12px;
            font-size: 12px;
            font-family: monospace;
            color: #9CA3AF;
            min-height: 80px;
            max-height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        /* Responsive Mobile Emulator View */
        .emulator-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .phone-frame {
            width: 100%;
            max-width: 360px;
            height: 580px;
            background: #000000;
            border-radius: 36px;
            border: 8px solid #1F2937;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate-x(-50%);
            width: 110px;
            height: 16px;
            background: #1F2937;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 50;
        }

        .screen-canvas { width: 100%; height: 100%; background: white; relative: true; }
        iframe { width: 100%; height: 100%; border: none; background: white; }

        .loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(17, 24, 39, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-center: true;
            z-index: 40;
        }
        .hidden { display: none !important; }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #3B82F6;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loader-overlay p { font-size: 14px; color: white; font-weight: 500; }
        .loader-overlay span { font-size: 12px; color: #9CA3AF; margin-top: 4px; }

        @media (min-width: 768px) {
            body { flex-direction: row; padding: 24px; gap: 24px; overflow: hidden; }
            .container { flex-direction: row; max-width: 1400px; height: 100%; }
            .left-panel { width: 400px; height: 100%; overflow-y: auto; }
            .emulator-wrapper { flex-1: true; height: 100%; margin-top: 0; align-items: center; }
            .phone-frame { height: 700px; }
            #statusLog { min-height: 150px; max-height: none; flex-grow: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Side Controls Panel -->
        <div class="left-panel flex flex-col" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <h1>AI App Builder</h1>
                <p class="subtitle">Generate professional apps instantly</p>
            </div>

            <!-- API Setup Card -->
            <div class="card">
                <label>🔑 Gemini API Key (Saved Locally)</label>
                <div class="api-row">
                    <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
                    <button class="btn-save" onclick="saveApiKey()">Save</button>
                </div>
                <div id="apiKeyStatus">Please enter your API Key to activate the builder.</div>
            </div>

            <!-- Prompt Input Card -->
            <div class="card">
                <label>Describe Your App Idea</label>
                <textarea id="appPrompt" rows="4" placeholder="E.g., Mujhe ek kapde bechne wala app chahiye jisme product catalog ho... (Type in Hindi, Hinglish or English)"></textarea>
                <button onclick="generateApp()" style="margin-top: 5px;">✨ Generate App</button>
            </div>

            <!-- Status Logs Card -->
            <div class="card" style="flex-grow: 1;">
                <label>System Logs / Status</label>
                <div id="statusLog">System ready. Waiting for prompt...</div>
            </div>
        </div>

        <!-- Right Side Mobile Emulator Canvas -->
        <div class="emulator-wrapper">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="screen-canvas">
                    <iframe id="emulatorFrame"></iframe>
                    
                    <!-- Loading Block Overlay -->
                    <div id="emulatorLoading" class="loader-overlay hidden">
                        <div class="spinner"></div>
                        <p>AI is writing code...</p>
                        <span>Aapka professional app taiyar ho raha hai.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('user_gemini_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                const status = document.getElementById('apiKeyStatus');
                status.innerText = "✅ API Key loaded and active!";
                status.style.color = "#10B981";
            }
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) {
                localStorage.setItem('user_gemini_key', key);
                const status = document.getElementById('apiKeyStatus');
                status.innerText = "✅ API Key saved securely!";
                status.style.color = "#10B981";
                alert("API Key Successfully Saved Locally!");
            } else {
                alert("Please enter a valid key.");
            }
        }

        async function generateApp() {
            const key = localStorage.getItem('user_gemini_key');
            const prompt = document.getElementById('appPrompt').value.trim();
            const logBox = document.getElementById('statusLog');
            const loading = document.getElementById('emulatorLoading');
            const iframe = document.getElementById('emulatorFrame');

            if (!key) {
                alert("Please save your Gemini API Key first!");
                return;
            }
            if (!prompt) {
                alert("Please write your app idea prompt first!");
                return;
            }

            loading.classList.remove('hidden');
            logBox.innerText = "Connecting to Google Gemini API...\nAnalyzing layout requirements...";

            }

            // Start Loading Visuals
            loading.classList.remove('hidden');
            logBox.innerText = "Connecting to Google Gemini API...\nAnalyzing layout requirement...";

            // Secure System Instruction for Language Matching Rule
            const systemInstruction = "You are an expert Android Frontend developer. Generate a beautiful, fully functional single-page web app application wrapper using clean HTML, modern responsive mobile-first Tailwind CSS, and robust JavaScript based on the user's idea. Output ONLY the raw HTML source code, absolutely no markdown formatting, no ```html tags, just pure executable code. IMPORTANT RULE: If the user inputs their prompt in Hindi or Hinglish, write a final status explanation summary paragraph at the absolute bottom inside a hidden comment block or text element explaining what you built in perfect friendly Hindi/Hinglish. If they write in English, explain in English.";

            try {
                // Call Gemini API directly from the client side securely using user's local key
                const response = await fetch(`https://googleapis.com{key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemInstruction }] }
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let generatedCode = data.candidates[0].content.parts[0].text;
                    
                    // Clean up potential markdown blocks if AI generates them by mistake
                    generatedCode = generatedCode.replace(/```html/g, '').replace(/```/g, '').trim();

                    // Render code inside the Emulator Frame
                    const blob = new Blob([generatedCode], { type: 'text/html' });
                    iframe.src = URL.createObjectURL(blob);

                    logBox.innerText = "✨ App Build Successful!\n\n[AI Summary]:\n" + (prompt.match(/[\u0900-\u097F]/) || prompt.toLowerCase().match(/(mujhe|banao|app|chahiye|hai|karne)/) 
                        ? "Aapka Android App interface taiyar kar diya gaya hai. Saari layouts aur visual configurations implement ho chuki hain!" 
                        : "Application UI code generated and successfully compiled into the emulator workspace views.");
                } else {
                    logBox.innerText = "Error: Invalid response structure from AI. Please try again.";
                }
            } catch (error) {
                console.error(error);
                logBox.innerText = "Failed to compile: " + error.message;
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
